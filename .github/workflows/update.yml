name: 更新综艺、日番、假面骑士与超级战队片单

# 内容筛选规则变更时自动重新生成片单。

on:
  workflow_dispatch:
  schedule:
    - cron: "50 23 * * *"
    - cron: "50 8 * * *"
  push:
    branches: [main]
    paths:
      - "config.json"
      - "mapping.json"
      - "requirements.txt"
      - "scripts/**"
      - ".github/workflows/update.yml"

concurrency:
  group: emos-watch-update
  cancel-in-progress: true

# 生成文件由任务自动提交到 main。

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate watch feeds and liquid glass GIF covers
        env:
          TODB_API_TOKEN: ${{ secrets.TODB_API_TOKEN }}
        run: python scripts/update_watch.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A watch.json watch-variety.json watch-japan.json watch-kamen-rider.json watch-super-sentai.json cover.gif cover-variety.gif cover-japan.gif cover-kamen-rider.gif cover-super-sentai.gif data
          git diff --cached --quiet || git commit -m "更新综艺及特摄正剧片单"
          git push

      - name: Refresh jsDelivr cover cache
        run: |
          curl -fsS https://purge.jsdelivr.net/gh/xlmc/emos-watch@main/watch.json
          curl -fsS https://purge.jsdelivr.net/gh/xlmc/emos-watch@main/watch-variety.json
          curl -fsS https://purge.jsdelivr.net/gh/xlmc/emos-watch@main/watch-japan.json
          curl -fsS https://purge.jsdelivr.net/gh/xlmc/emos-watch@main/watch-kamen-rider.json
          curl -fsS https://purge.jsdelivr.net/gh/xlmc/emos-watch@main/watch-super-sentai.json
          curl -fsS https://purge.jsdelivr.net/gh/xlmc/emos-watch@main/cover.gif
          curl -fsS https://purge.jsdelivr.net/gh/xlmc/emos-watch@main/cover-variety.gif
          curl -fsS https://purge.jsdelivr.net/gh/xlmc/emos-watch@main/cover-japan.gif
          curl -fsS https://purge.jsdelivr.net/gh/xlmc/emos-watch@main/cover-kamen-rider.gif
          curl -fsS https://purge.jsdelivr.net/gh/xlmc/emos-watch@main/cover-super-sentai.gif

