name: 更新豆瓣热门大陆影视与国漫片单

on:
  workflow_dispatch:
  schedule:
    - cron: "50 23 * * *"
    - cron: "50 8 * * *"
  push:
    branches: [main]
    paths:
      - "config.json"
      - "mapping.json"
      - "requirements.txt"
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate watch feed and static cover
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        run: python scripts/update_watch.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A watch.json cover.jpg data
          git diff --cached --quiet || git commit -m "更新豆瓣热门大陆影视与国漫片单"
          git push

